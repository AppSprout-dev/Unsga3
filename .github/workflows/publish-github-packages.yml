name: publish-github-packages

# Publishes Unsga3 nupkg to GitHub Packages (NuGet registry) on version tags or manual dispatch.
# Consume: https://nuget.pkg.github.com/<owner>/index.json  (auth: PAT with read:packages)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify tag matches Directory.Build.props Version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VER="${GITHUB_REF#refs/tags/v}"
          PROP_VER="$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props | head -n1 | tr -d '[:space:]')"
          echo "tag=${TAG_VER} Directory.Build.props=${PROP_VER}"
          if [ "${TAG_VER}" != "${PROP_VER}" ]; then
            echo "::error::Tag v${TAG_VER} does not match Directory.Build.props <Version>${PROP_VER}</Version>."
            exit 1
          fi

      - name: Test
        run: dotnet test Unsga3.slnx -c Release -p:TreatWarningsAsErrors=true --verbosity minimal

      - name: Pack
        run: |
          dotnet pack src/Unsga3/Unsga3.csproj -c Release -o artifacts \
            -p:RepositoryUrl=https://github.com/${{ github.repository }} \
            -p:PackageProjectUrl=https://github.com/${{ github.repository }}

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
            --skip-duplicate
